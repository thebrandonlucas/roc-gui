name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest nightly is resolved once, here; every job installs that one, so
  # one run never tests two compilers.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  check:
    name: Roc pins, scripts and applications
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: thebrandonlucas/kai/.github/actions/setup-kai@fd316fbad644f2e52c620ad83385fcc4b9c31372 # v0.0.12
        with:
          version: 0.0.12
          nix: 'false'
      - run: kai run compiler-version
      - run: kai run check

  # The host compiles against committed bindings. They must be the ones the
  # resolved nightly generates from its own glue specification.
  bindings:
    name: Host bindings match the nightly
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: thebrandonlucas/kai/.github/actions/setup-kai@fd316fbad644f2e52c620ad83385fcc4b9c31372 # v0.0.12
        with:
          version: 0.0.12
          nix: 'false'
      - name: Download the nightly's source and verify its published digest
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          asset="roc_nightly-source-${NIGHTLY_TAG#nightly-}.tar.gz"
          gh release download "$NIGHTLY_TAG" -R roc-lang/nightlies -p "$asset" -D "$RUNNER_TEMP"
          digest=$(gh release view "$NIGHTLY_TAG" -R roc-lang/nightlies --json assets --jq ".assets[] | select(.name == \"$asset\") | .digest")
          echo "${digest#sha256:}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir "$RUNNER_TEMP/roc-source"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/roc-source" --strip-components=1
      - run: kai run regenerate-glue -- "$RUNNER_TEMP/roc-source"
      - name: Require the committed bindings
        run: git diff --exit-code -- crates/host/src

  kai-build:
    name: Kai build and application semantics
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: thebrandonlucas/kai/.github/actions/setup-kai@fd316fbad644f2e52c620ad83385fcc4b9c31372 # v0.0.12
        with:
          version: 0.0.12
          nix: 'true'
      - name: Install native Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libasound2t64 fontconfig sway grim libvulkan1 mesa-vulkan-drivers
      # The macOS environment must evaluate; nothing is built for it here.
      - name: Evaluate the aarch64-darwin environment
        run: |
          kai shell default -- true
          nix eval --raw "path:$PWD/.kai/generated/nix#devShells.aarch64-darwin.default.drvPath" >/dev/null
      - run: kai run lint
      - run: kai run build
      - run: python3 scripts/headless_wayland.py -- kai run test -- --only semantic --jobs 2 --timeout 300

  # Each target's host is produced once; its tests wait only for that host.
  host-x64glibc:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
    with: { os: ubuntu-24.04, target: x64glibc, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  host-arm64mac:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
    with: { os: macos-15, target: arm64mac, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  host-x64mingw:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
    with: { os: windows-2025, target: x64mingw, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }

  # When the host was built rather than restored, the archive a release would
  # publish is composed from that same sealed build; nothing else waits on it.
  candidate-x64glibc:
    needs: [resolve, host-x64glibc]
    if: needs.host-x64glibc.outputs.mode == 'built'
    permissions:
      contents: read
    uses: ./.github/workflows/host-candidate.yml
    with: { os: ubuntu-24.04, target: x64glibc, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  candidate-arm64mac:
    needs: [resolve, host-arm64mac]
    if: needs.host-arm64mac.outputs.mode == 'built'
    permissions:
      contents: read
    uses: ./.github/workflows/host-candidate.yml
    with: { os: macos-15, target: arm64mac, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  candidate-x64mingw:
    needs: [resolve, host-x64mingw]
    if: needs.host-x64mingw.outputs.mode == 'built'
    permissions:
      contents: read
    uses: ./.github/workflows/host-candidate.yml
    with: { os: windows-2025, target: x64mingw, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }

  policy:
    name: Repository policy
    needs: [resolve, host-x64glibc]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: ./.github/actions/setup-native-test
        with:
          target: x64glibc
      - name: Release and artifact policy tests
        run: |
          python3 -m unittest \
            scripts/test_ci_host.py \
            scripts/test_compiler_environment.py \
            scripts/test_alsa_dependencies.py \
            scripts/test_link_input_artifacts.py \
            scripts/test_kai_link_inputs.py \
            scripts/test_kai_admission.py \
            scripts/test_dependency_artifacts.py \
            scripts/test_prepare_windows_gnu.py \
            scripts/test_host_release_policy.py \
            scripts/test_docs_publication.py \
            scripts/test_cargo_build_evidence.py \
            scripts/test_git_cargo_sources.py \
            scripts/test_macos_interfaces.py \
            scripts/test_gpui_smoke.py \
            scripts/test_window_routing.py

  native-x64glibc:
    needs: [resolve, host-x64glibc]
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with: { os: ubuntu-24.04, target: x64glibc, spec_jobs: 2, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  native-arm64mac:
    needs: [resolve, host-arm64mac]
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with: { os: macos-15, target: arm64mac, smoke_executable: counter, window: true, missing_shots: --allow-missing-shots, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  native-x64mingw:
    needs: [resolve, host-x64mingw]
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with: { os: windows-2025, target: x64mingw, smoke_executable: counter.exe, window: true, gallery: true, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }

  # Check rendering independently; Pages assembly requires the tested gallery.
  docs:
    name: Documentation
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The generated API reference comes from the nightly this run resolved,
      # so the manual documents the signatures that compiler sees.
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: thebrandonlucas/kai/.github/actions/setup-kai@fd316fbad644f2e52c620ad83385fcc4b9c31372 # v0.0.12
        with:
          version: 0.0.12
          nix: 'false'
      - id: renderer
        # TODO(thebrandonlucas/roc-automation): the fork's kai-tool action,
        # which resolves a tool with `kai run TASK`, with the existing tool
        # action's inputs and outputs. Pinned to the head of the fork's kai branch.
        uses: thebrandonlucas/roc-automation/actions/kai-tool@19a848eef6e345a671191da6fa6818918c815aa6
        with:
          task: docs-path
          label: roc-docs tools-0.6.0
      # This site tracks the branch and uses this run's compiler for the API.
      - name: Build HTML, PDF, Markdown and API documentation
        uses: lukewilliamboswell/roc-automation/actions/build-docs@ff89350926987a316333acf983f09591f19a946e
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          pdf-filename: roc-gui.pdf
          docs-version: main
          api-entrypoint: platform/main.roc
          site-url: https://lukewilliamboswell.github.io/roc-gui/
      - name: Check public documentation links, source text and API integration
        run: python3 scripts/check_docs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation-site
          path: .docs-out/site
          if-no-files-found: error
          retention-days: 7

  docs-site:
    name: Assemble documentation and gallery
    needs: [docs, native-x64mingw]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: documentation-site
          path: .docs-out/site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: example-gallery
          path: .docs-out/site/gallery
      - name: Require the complete manual, API and tested gallery before publication
        run: |
          test -s .docs-out/site/index.html
          test -s .docs-out/site/api/index.html
          test -s .docs-out/site/roc-gui.pdf
          for example in http-workbench database-browser file-explorer terminal-workspace \
            image-library music-player clipboard-history system-monitor settings-center \
            device-configurator animation-studio redis-explorer; do
            test -s ".docs-out/site/gallery/$example.gif"
          done
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: .docs-out/site }

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # The one required status check. Host candidates run only when a host
  # changed, so a skipped job passes; a failed or cancelled one does not.
  ci:
    name: CI
    if: always()
    needs:
      - check
      - bindings
      - kai-build
      - candidate-x64glibc
      - candidate-arm64mac
      - candidate-x64mingw
      - policy
      - native-x64glibc
      - native-arm64mac
      - native-x64mingw
      - docs
      - docs-site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed or been skipped by design
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
