name: Install the Roc GUI toolchain
description: Install Kai, Zig and the Roc nightly this run resolved once.
inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
runs:
  using: composite
  steps:
    # build.py admits the locked FreeType linker input against `kai build
    # freetype --plan`, so every job that builds a host needs Kai.
    # TODO: Kai runs on Linux only for now; the macOS and Windows host and
    # native jobs wait for a Kai release that runs there.
    - if: runner.os == 'Linux'
      uses: thebrandonlucas/kai/.github/actions/setup-kai@fd316fbad644f2e52c620ad83385fcc4b9c31372 # v0.0.12
      with:
        version: 0.0.12
        nix: 'true'
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.16.0
        use-cache: false
    - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ inputs.nightly-tag }}
    - name: Keep downloaded compiler outside release source
      shell: bash
      run: python3 scripts/toolchain.py --relocate-for-ci
    - name: Report the compiler
      shell: bash
      run: roc version
